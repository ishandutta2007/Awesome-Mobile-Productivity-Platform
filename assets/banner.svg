<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: linear-gradient(135deg, #090d16 0%, #0d1527 50%, #16102b 100%); border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <radialGradient id="ambientCyan" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambientPurple" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
      }
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes slidePill1 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(12px); }
      }
      @keyframes slidePill2 {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-12px); }
      }
      .floating-card { animation: floatSlow 6s ease-in-out infinite; }
      .ambient-glow { animation: pulseSlow 5s ease-in-out infinite; }
      .anim-pill-1 { animation: slidePill1 4s ease-in-out infinite; }
      .anim-pill-2 { animation: slidePill2 4.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ambient dynamic glow background -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#ambientCyan)" class="ambient-glow" />
  <rect x="0" y="0" width="1200" height="340" fill="url(#ambientPurple)" class="ambient-glow" style="animation-delay: -2.5s;" />

  <!-- Subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68" />
    <line x1="0" y1="136" x2="1200" y2="136" />
    <line x1="0" y1="204" x2="1200" y2="204" />
    <line x1="0" y1="272" x2="1200" y2="272" />
    <line x1="200" y1="0" x2="200" y2="340" />
    <line x1="400" y1="0" x2="400" y2="340" />
    <line x1="600" y1="0" x2="600" y2="340" />
    <line x1="800" y1="0" x2="800" y2="340" />
    <line x1="1000" y1="0" x2="1000" y2="340" />
  </g>

  <!-- Background decorative floating phone mockup card -->
  <g class="floating-card" transform="translate(930, 45)">
    <rect width="180" height="250" rx="24" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Dynamic notch -->
    <rect x="60" y="10" width="60" height="8" rx="4" fill="#ffffff" fill-opacity="0.2" />
    <!-- Mini UI task cards inside mockup -->
    <rect x="20" y="36" width="140" height="24" rx="6" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="32" cy="48" r="4" fill="#38bdf8" />
    <rect x="44" y="44" width="70" height="8" rx="3" fill="#ffffff" fill-opacity="0.6" />
    <rect x="20" y="70" width="140" height="24" rx="6" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="32" cy="82" r="4" fill="#818cf8" />
    <rect x="44" y="78" width="90" height="8" rx="3" fill="#ffffff" fill-opacity="0.6" />
    <rect x="20" y="104" width="140" height="24" rx="6" fill="#c084fc" fill-opacity="0.15" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="32" cy="116" r="4" fill="#c084fc" />
    <rect x="44" y="112" width="60" height="8" rx="3" fill="#ffffff" fill-opacity="0.6" />
    <!-- Stats graph in mockup -->
    <path d="M 24 190 Q 60 160 90 175 T 156 140" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="156" cy="140" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Title and Main Content (Guaranteed crisp foreground) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Tag -->
    <g class="anim-pill-1">
      <rect x="0" y="0" width="265" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="20" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED MOBILE ECOSYSTEM</text>
    </g>

    <!-- Main Gradient Title -->
    <text x="0" y="78" fill="url(#glowGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">Mobile Productivity Platform</text>

    <!-- Subtitle -->
    <text x="0" y="116" fill="#f8fafc" font-size="19" font-weight="500">Native Mobile Apps, Offline-First Task Management &amp; Self-Hosted Suites</text>

    <!-- Detailed SEO Feature description -->
    <text x="0" y="148" fill="#94a3b8" font-size="14" font-weight="400">Comparing top Enterprise SaaS platforms and Open-Source projects for on-the-go efficiency.</text>

    <!-- Interactive / Dynamic feature pills -->
    <g transform="translate(0, 175)">
      <g class="anim-pill-1">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="18" y="20" fill="#e2e8f0" font-size="12" font-weight="600">📱 Native iOS &amp; Android</text>
      </g>
      <g class="anim-pill-2" transform="translate(155, 0)">
        <rect x="0" y="0" width="135" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="18" y="20" fill="#e2e8f0" font-size="12" font-weight="600">⚡ Offline-First Sync</text>
      </g>
      <g class="anim-pill-1" transform="translate(300, 0)">
        <rect x="0" y="0" width="145" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="18" y="20" fill="#e2e8f0" font-size="12" font-weight="600">🛡️ Self-Hosted / FOSS</text>
      </g>
      <g class="anim-pill-2" transform="translate(455, 0)">
        <rect x="0" y="0" width="140" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <text x="18" y="20" fill="#e2e8f0" font-size="12" font-weight="600">📊 Pricing &amp; Metrics</text>
      </g>
    </g>
  </g>
</svg>
